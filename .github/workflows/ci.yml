name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Safety regression suite (traps must all pass, zero leaks)
        run: npm test
      - run: npm run build
        env:
          GEMINI_API_KEY: ""
